<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title description">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<title id="title">Path-Following</title>
<desc id="description">An agent follows an ordered set of capture circles, not a continuously projected path.</desc>
<rect width="800" height="360" rx="16" fill="#f6f8fc"/>
<text x="30" y="36" fill="#172a42" font-family="Arial, sans-serif" font-size="21">Path-Following</text>
<circle cx="90" cy="240" r="11" fill="#1758a8" stroke="#1758a8" stroke-width="2"/>
<text x="82" y="271" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">p</text>
<line x1="240" y1="240" x2="430" y2="105" stroke="#a45100" stroke-width="3" stroke-dasharray="7 6"/>
<line x1="430" y1="105" x2="640" y2="220" stroke="#a45100" stroke-width="3" stroke-dasharray="7 6"/>
<circle cx="240" cy="240" r="9" fill="none" stroke="#a45100" stroke-width="2"/>
<line x1="226" y1="240" x2="254" y2="240" stroke="#a45100" stroke-width="2"/>
<line x1="240" y1="226" x2="240" y2="254" stroke="#a45100" stroke-width="2"/>
<text x="255" y="228" fill="#a45100" font-family="Arial, sans-serif" font-size="16">waypoint 0</text>
<circle cx="240" cy="240" r="35" fill="none" stroke="#a45100" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="430" cy="105" r="9" fill="none" stroke="#a45100" stroke-width="2"/>
<line x1="416" y1="105" x2="444" y2="105" stroke="#a45100" stroke-width="2"/>
<line x1="430" y1="91" x2="430" y2="119" stroke="#a45100" stroke-width="2"/>
<text x="445" y="93" fill="#a45100" font-family="Arial, sans-serif" font-size="16">waypoint 1</text>
<circle cx="430" cy="105" r="35" fill="none" stroke="#a45100" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="640" cy="220" r="9" fill="none" stroke="#a45100" stroke-width="2"/>
<line x1="626" y1="220" x2="654" y2="220" stroke="#a45100" stroke-width="2"/>
<line x1="640" y1="206" x2="640" y2="234" stroke="#a45100" stroke-width="2"/>
<text x="655" y="208" fill="#a45100" font-family="Arial, sans-serif" font-size="16">waypoint 2</text>
<circle cx="640" cy="220" r="35" fill="none" stroke="#a45100" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="90" y1="240" x2="210" y2="240" stroke="#087454" stroke-width="3" marker-end="url(#arrow)"/>
<text x="35" y="325" fill="#536579" font-family="Arial, sans-serif" font-size="16">Inside capture circle: advance index; final open waypoint keeps Arrive</text>
</svg>
