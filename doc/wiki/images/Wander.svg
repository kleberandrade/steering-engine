<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title description">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<title id="title">Wander</title>
<desc id="description">The wandering target lies on a forward circle, with a retained angular state.</desc>
<rect width="800" height="360" rx="16" fill="#f6f8fc"/>
<text x="30" y="36" fill="#172a42" font-family="Arial, sans-serif" font-size="21">Wander</text>
<circle cx="150" cy="210" r="11" fill="#1758a8" stroke="#1758a8" stroke-width="2"/>
<text x="142" y="241" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">p</text>
<line x1="150" y1="210" x2="300" y2="210" stroke="#1758a8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="180" y="185" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">heading</text>
<circle cx="470" cy="210" r="85" fill="none" stroke="#a45100" stroke-width="2"/>
<line x1="150" y1="210" x2="470" y2="210" stroke="#536579" stroke-width="3" stroke-dasharray="7 6"/>
<circle cx="521" cy="142" r="9" fill="none" stroke="#a45100" stroke-width="2"/>
<line x1="507" y1="142" x2="535" y2="142" stroke="#a45100" stroke-width="2"/>
<line x1="521" y1="128" x2="521" y2="156" stroke="#a45100" stroke-width="2"/>
<text x="536" y="130" fill="#a45100" font-family="Arial, sans-serif" font-size="16">circle target</text>
<line x1="470" y1="210" x2="521" y2="142" stroke="#a45100" stroke-width="3"/>
<line x1="150" y1="210" x2="390" y2="166" stroke="#087454" stroke-width="3" marker-end="url(#arrow)"/>
<text x="325" y="242" fill="#536579" font-family="Arial, sans-serif" font-size="16">distance</text>
<text x="520" y="228" fill="#a45100" font-family="Arial, sans-serif" font-size="16">radius</text>
<text x="35" y="330" fill="#536579" font-family="Arial, sans-serif" font-size="16">angle += random(-1, 1) * jitter * dt; keep one instance per agent</text>
</svg>
