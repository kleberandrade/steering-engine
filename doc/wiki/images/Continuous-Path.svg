<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title description">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<title id="title">Continuous-Path</title>
<desc id="description">A predicted position projects onto a finite polyline. Arc-distance look-ahead crosses the corner and chooses a target on the next edge.</desc>
<rect width="800" height="360" rx="16" fill="#f6f8fc"/>
<text x="30" y="36" fill="#172a42" font-family="Arial, sans-serif" font-size="21">Continuous-Path</text>
<line x1="100" y1="245" x2="475" y2="245" stroke="#a45100" stroke-width="4"/>
<line x1="475" y1="245" x2="475" y2="85" stroke="#a45100" stroke-width="4"/>
<circle cx="250" cy="180" r="11" fill="#1758a8" stroke="#1758a8" stroke-width="2"/>
<text x="242" y="211" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">p</text>
<line x1="250" y1="180" x2="340" y2="180" stroke="#1758a8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="280" y="150" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">predicted p + v*time</text>
<line x1="340" y1="180" x2="340" y2="245" stroke="#536579" stroke-width="3" stroke-dasharray="7 6"/>
<circle cx="340" cy="245" r="11" fill="#087454" stroke="#087454" stroke-width="2"/>
<text x="332" y="276" fill="#087454" font-family="Arial, sans-serif" font-size="16">projection</text>
<line x1="340" y1="245" x2="475" y2="245" stroke="#087454" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="475" y1="245" x2="475" y2="165" stroke="#087454" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="475" cy="165" r="9" fill="none" stroke="#a45100" stroke-width="2"/>
<line x1="461" y1="165" x2="489" y2="165" stroke="#a45100" stroke-width="2"/>
<line x1="475" y1="151" x2="475" y2="179" stroke="#a45100" stroke-width="2"/>
<text x="490" y="153" fill="#a45100" font-family="Arial, sans-serif" font-size="16">arc target</text>
<text x="540" y="235" fill="#087454" font-family="Arial, sans-serif" font-size="16">ahead along route</text>
<text x="35" y="335" fill="#536579" font-family="Arial, sans-serif" font-size="16">FollowPolyline: finite projection + arc target; FollowPath keeps waypoint capture</text>
</svg>
