<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title description">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<title id="title">Obstacle-Avoidance</title>
<desc id="description">The forward scan meets an inflated obstacle surface before its center. Tangential steering and braking respond to the first entry.</desc>
<rect width="800" height="360" rx="16" fill="#f6f8fc"/>
<text x="30" y="36" fill="#172a42" font-family="Arial, sans-serif" font-size="21">Obstacle-Avoidance</text>
<circle cx="110" cy="210" r="11" fill="#1758a8" stroke="#1758a8" stroke-width="2"/>
<text x="102" y="241" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">p</text>
<line x1="110" y1="210" x2="670" y2="210" stroke="#1758a8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="605" y="240" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">scan</text>
<circle cx="450" cy="185" r="55" fill="#ffe7ca" stroke="#a45100" stroke-width="2"/>
<circle cx="450" cy="185" r="85" fill="none" stroke="#a45100" stroke-width="2" stroke-dasharray="7 6"/>
<text x="410" y="85" fill="#a45100" font-family="Arial, sans-serif" font-size="16">expanded R</text>
<circle cx="369" cy="210" r="11" fill="#a45100" stroke="#a45100" stroke-width="2"/>
<text x="361" y="241" fill="#a45100" font-family="Arial, sans-serif" font-size="16">entry</text>
<line x1="110" y1="210" x2="75" y2="285" stroke="#087454" stroke-width="3" marker-end="url(#arrow)"/>
<text x="155" y="290" fill="#087454" font-family="Arial, sans-serif" font-size="16">lateral + braking</text>
<text x="35" y="335" fill="#536579" font-family="Arial, sans-serif" font-size="16">R = obstacle.radius + agentRadius + safetyMargin; choose first surface</text>
</svg>
