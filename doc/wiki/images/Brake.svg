<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title description">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<title id="title">Brake</title>
<desc id="description">Braking acceleration opposes current velocity; it does not change position directly.</desc>
<rect width="800" height="360" rx="16" fill="#f6f8fc"/>
<text x="30" y="36" fill="#172a42" font-family="Arial, sans-serif" font-size="21">Brake</text>
<circle cx="340" cy="190" r="11" fill="#1758a8" stroke="#1758a8" stroke-width="2"/>
<text x="332" y="221" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">p</text>
<line x1="340" y1="190" x2="590" y2="190" stroke="#1758a8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="550" y="170" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">v</text>
<line x1="340" y1="220" x2="160" y2="220" stroke="#087454" stroke-width="3" marker-end="url(#arrow)"/>
<text x="95" y="250" fill="#087454" font-family="Arial, sans-serif" font-size="16">a opposes v</text>
<text x="50" y="315" fill="#536579" font-family="Arial, sans-serif" font-size="16">a = limit(-v / T, A)    |    vNext can remain nonzero</text>
</svg>
