<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title description">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<title id="title">Foundations</title>
<desc id="description">Current velocity and desired velocity share an origin; correction points from the current velocity tip to the desired velocity tip.</desc>
<rect width="800" height="360" rx="16" fill="#f6f8fc"/>
<text x="30" y="36" fill="#172a42" font-family="Arial, sans-serif" font-size="21">Foundations</text>
<circle cx="140" cy="260" r="11" fill="#1758a8" stroke="#1758a8" stroke-width="2"/>
<text x="132" y="291" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">p</text>
<line x1="140" y1="260" x2="290" y2="130" stroke="#1758a8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="240" y="110" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">v: current / atual</text>
<line x1="140" y1="260" x2="590" y2="260" stroke="#a45100" stroke-width="3" marker-end="url(#arrow)"/>
<text x="470" y="290" fill="#a45100" font-family="Arial, sans-serif" font-size="16">u: desired / desejada</text>
<line x1="290" y1="130" x2="590" y2="260" stroke="#087454" stroke-width="3" marker-end="url(#arrow)"/>
<text x="440" y="170" fill="#087454" font-family="Arial, sans-serif" font-size="16">u - v</text>
<text x="30" y="335" fill="#536579" font-family="Arial, sans-serif" font-size="16">a = limit((u - v) / T, A)    |    pNext = p + vNext * dt</text>
</svg>
