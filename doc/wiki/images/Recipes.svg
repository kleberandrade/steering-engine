<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title description">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<title id="title">Recipes</title>
<desc id="description">A fixed-step simulation reads old snapshots, computes new snapshots, then lets the renderer read them.</desc>
<rect width="800" height="360" rx="16" fill="#f6f8fc"/>
<text x="30" y="36" fill="#172a42" font-family="Arial, sans-serif" font-size="21">Recipes</text>
<circle cx="150" cy="180" r="58" fill="none" stroke="#1758a8" stroke-width="2"/>
<text x="70" y="270" fill="#1758a8" font-family="Arial, sans-serif" font-size="18">old snapshots</text>
<circle cx="400" cy="180" r="58" fill="none" stroke="#087454" stroke-width="2"/>
<text x="320" y="270" fill="#087454" font-family="Arial, sans-serif" font-size="18">fixed-step update</text>
<circle cx="650" cy="180" r="58" fill="none" stroke="#a45100" stroke-width="2"/>
<text x="570" y="270" fill="#a45100" font-family="Arial, sans-serif" font-size="18">renderer</text>
<line x1="210" y1="180" x2="340" y2="180" stroke="#087454" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="460" y1="180" x2="590" y2="180" stroke="#087454" stroke-width="3" marker-end="url(#arrow)"/>
<text x="80" y="330" fill="#536579" font-family="Arial, sans-serif" font-size="16">Stateful calculate(): simulation only. Rendering reads the completed frame.</text>
</svg>
