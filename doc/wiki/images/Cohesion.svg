<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title description">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<title id="title">Cohesion</title>
<desc id="description">Local neighbor contributions are combined around a central observer; arrows show different local rules, not trajectories.</desc>
<rect width="800" height="360" rx="16" fill="#f6f8fc"/>
<text x="30" y="36" fill="#172a42" font-family="Arial, sans-serif" font-size="21">Cohesion</text>
<circle cx="310" cy="190" r="11" fill="#1758a8" stroke="#1758a8" stroke-width="2"/>
<text x="302" y="221" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">p</text>
<circle cx="310" cy="190" r="125" fill="none" stroke="#1758a8" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="370" cy="130" r="11" fill="#a45100" stroke="#a45100" stroke-width="2"/>
<text x="362" y="161" fill="#a45100" font-family="Arial, sans-serif" font-size="16">n1</text>
<circle cx="390" cy="210" r="11" fill="#a45100" stroke="#a45100" stroke-width="2"/>
<text x="382" y="241" fill="#a45100" font-family="Arial, sans-serif" font-size="16">n2</text>
<circle cx="280" cy="260" r="11" fill="#a45100" stroke="#a45100" stroke-width="2"/>
<text x="272" y="291" fill="#a45100" font-family="Arial, sans-serif" font-size="16">n3</text>
<circle cx="347" cy="200" r="9" fill="none" stroke="#a45100" stroke-width="2"/>
<line x1="333" y1="200" x2="361" y2="200" stroke="#a45100" stroke-width="2"/>
<line x1="347" y1="186" x2="347" y2="214" stroke="#a45100" stroke-width="2"/>
<text x="362" y="188" fill="#a45100" font-family="Arial, sans-serif" font-size="16">local center</text>
<line x1="310" y1="190" x2="347" y2="200" stroke="#087454" stroke-width="3" marker-end="url(#arrow)"/>
<text x="475" y="160" fill="#087454" font-family="Arial, sans-serif" font-size="16">Positional attraction</text>
<text x="475" y="195" fill="#536579" font-family="Arial, sans-serif" font-size="16">No shared-velocity damping</text>
<text x="35" y="340" fill="#536579" font-family="Arial, sans-serif" font-size="16">Use the same old frame for every agent, then replace the whole population</text>
</svg>
