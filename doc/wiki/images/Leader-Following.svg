<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title description">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<title id="title">Leader-Following</title>
<desc id="description">An arrival target is placed behind leader velocity; a local exclusion circle has priority.</desc>
<rect width="800" height="360" rx="16" fill="#f6f8fc"/>
<text x="30" y="36" fill="#172a42" font-family="Arial, sans-serif" font-size="21">Leader-Following</text>
<circle cx="520" cy="170" r="11" fill="#a45100" stroke="#a45100" stroke-width="2"/>
<text x="512" y="201" fill="#a45100" font-family="Arial, sans-serif" font-size="16">leader</text>
<line x1="520" y1="170" x2="680" y2="170" stroke="#a45100" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="520" cy="170" r="45" fill="none" stroke="#a45100" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="350" cy="170" r="9" fill="none" stroke="#a45100" stroke-width="2"/>
<line x1="336" y1="170" x2="364" y2="170" stroke="#a45100" stroke-width="2"/>
<line x1="350" y1="156" x2="350" y2="184" stroke="#a45100" stroke-width="2"/>
<text x="365" y="158" fill="#a45100" font-family="Arial, sans-serif" font-size="16">trailing target</text>
<line x1="350" y1="170" x2="520" y2="170" stroke="#536579" stroke-width="3" stroke-dasharray="7 6"/>
<circle cx="140" cy="260" r="11" fill="#1758a8" stroke="#1758a8" stroke-width="2"/>
<text x="132" y="291" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">follower</text>
<line x1="140" y1="260" x2="310" y2="187" stroke="#087454" stroke-width="3" marker-end="url(#arrow)"/>
<text x="35" y="330" fill="#536579" font-family="Arial, sans-serif" font-size="16">target = leader.position - heading * distance    |    clearance before arrival</text>
</svg>
