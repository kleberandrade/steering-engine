<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title description">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<title id="title">Weighted-Blend</title>
<desc id="description">Weighted acceleration vectors sum before a final magnitude cap; weights are not normalized.</desc>
<rect width="800" height="360" rx="16" fill="#f6f8fc"/>
<text x="30" y="36" fill="#172a42" font-family="Arial, sans-serif" font-size="21">Weighted-Blend</text>
<circle cx="210" cy="260" r="11" fill="#1758a8" stroke="#1758a8" stroke-width="2"/>
<text x="202" y="291" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">p</text>
<line x1="210" y1="260" x2="440" y2="260" stroke="#1758a8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="290" y="285" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">w1 * a1</text>
<line x1="440" y1="260" x2="440" y2="100" stroke="#a45100" stroke-width="3" marker-end="url(#arrow)"/>
<text x="455" y="190" fill="#a45100" font-family="Arial, sans-serif" font-size="16">w2 * a2</text>
<line x1="210" y1="260" x2="440" y2="100" stroke="#087454" stroke-width="3" marker-end="url(#arrow)"/>
<text x="230" y="150" fill="#087454" font-family="Arial, sans-serif" font-size="16">sum</text>
<text x="50" y="330" fill="#536579" font-family="Arial, sans-serif" font-size="16">a = limit(sum(weight * acceleration), A); opposite contributions can cancel</text>
</svg>
