<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title description">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<title id="title">Queue-Following</title>
<desc id="description">Only strictly forward occupants within the lane count as blockers; the nearest one limits forward motion.</desc>
<rect width="800" height="360" rx="16" fill="#f6f8fc"/>
<text x="30" y="36" fill="#172a42" font-family="Arial, sans-serif" font-size="21">Queue-Following</text>
<line x1="65" y1="135" x2="710" y2="135" stroke="#536579" stroke-width="3" stroke-dasharray="7 6"/>
<line x1="65" y1="245" x2="710" y2="245" stroke="#536579" stroke-width="3" stroke-dasharray="7 6"/>
<circle cx="170" cy="190" r="11" fill="#1758a8" stroke="#1758a8" stroke-width="2"/>
<text x="162" y="221" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">p</text>
<circle cx="390" cy="190" r="11" fill="#a45100" stroke="#a45100" stroke-width="2"/>
<text x="382" y="221" fill="#a45100" font-family="Arial, sans-serif" font-size="16">blocker</text>
<circle cx="590" cy="190" r="11" fill="#a45100" stroke="#a45100" stroke-width="2"/>
<text x="582" y="221" fill="#a45100" font-family="Arial, sans-serif" font-size="16">farther</text>
<circle cx="350" cy="85" r="11" fill="#536579" stroke="#536579" stroke-width="2"/>
<text x="342" y="116" fill="#536579" font-family="Arial, sans-serif" font-size="16">outside lane</text>
<line x1="170" y1="190" x2="285" y2="190" stroke="#1758a8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="170" y1="220" x2="390" y2="220" stroke="#087454" stroke-width="3"/>
<text x="265" y="245" fill="#087454" font-family="Arial, sans-serif" font-size="16">gap</text>
<text x="540" y="285" fill="#1758a8" font-family="Arial, sans-serif" font-size="16">direction +X</text>
<text x="35" y="335" fill="#536579" font-family="Arial, sans-serif" font-size="16">Cap forward acceleration from gap and blocker speed; keep lateral request</text>
</svg>
