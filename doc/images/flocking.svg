<svg xmlns="http://www.w3.org/2000/svg" width="930" height="270" viewBox="0 0 930 270" role="img" aria-label="Separation repels, alignment matches velocity, and cohesion attracts toward a local center">
 <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#6ae4d4" stroke-width="1.5"/></marker></defs>
 <rect width="930" height="270" rx="18" fill="#111b2a"/>
 <g font-family="Arial,sans-serif" fill="#d9e4f3">
  <text x="24" y="31" font-size="13" letter-spacing="2">FLOCKING / THREE LOCAL RULES</text>
  <g transform="translate(20 48)">
   <rect width="286" height="200" rx="12" fill="#162235"/>
   <text x="16" y="27" font-size="14">SEPARATION</text>
   <circle cx="145" cy="105" r="62" fill="none" stroke="#42546d" stroke-dasharray="4 5"/>
   <circle cx="173" cy="80" r="7" fill="#a497ff"/><circle cx="178" cy="126" r="7" fill="#a497ff"/>
   <circle cx="145" cy="105" r="9" fill="#6ae4d4"/>
   <path d="M134 105H93" stroke="#6ae4d4" stroke-width="2" marker-end="url(#arrow)"/>
