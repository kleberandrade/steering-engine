   <circle cx="172" cy="75" r="7" fill="#a497ff"/><circle cx="182" cy="130" r="7" fill="#a497ff"/>
   <circle cx="177" cy="102.5" r="4" fill="#f3c577"/>
   <circle cx="140" cy="105" r="9" fill="#6ae4d4"/>
   <path d="M151 105 169 103" stroke="#6ae4d4" stroke-width="2" marker-end="url(#arrow)"/>
   <text x="16" y="183" fill="#8b9bb4" font-size="12">Attract toward the local center</text>
