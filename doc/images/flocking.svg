  </g>
  <g transform="translate(322 48)">
   <rect width="286" height="200" rx="12" fill="#162235"/>
   <text x="16" y="27" font-size="14">ALIGNMENT</text>
   <circle cx="145" cy="105" r="62" fill="none" stroke="#42546d" stroke-dasharray="4 5"/>
   <circle cx="113" cy="79" r="7" fill="#a497ff"/><circle cx="161" cy="131" r="7" fill="#a497ff"/>
   <path d="M114 71 130 52 M162 123 178 104" stroke="#a497ff" stroke-width="2"/>
   <circle cx="145" cy="105" r="9" fill="#6ae4d4"/>
   <path d="M153 95 175 68" stroke="#6ae4d4" stroke-width="2" marker-end="url(#arrow)"/>
   <text x="16" y="183" fill="#8b9bb4" font-size="12">Match local average velocity</text>
  </g>
  <g transform="translate(624 48)">
   <rect width="286" height="200" rx="12" fill="#162235"/>
   <text x="16" y="27" font-size="14">COHESION</text>
