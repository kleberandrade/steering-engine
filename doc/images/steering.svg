<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Conceptual steering behavior diagrams"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#6ae4d4"/></marker></defs><rect width="1000" height="420" rx="20" fill="#111b2a"/><g font-family="Arial,sans-serif" fill="#d9e4f3"><text x="25" y="33" font-size="13" fill="#8b9bb4" letter-spacing="2">STEERING ENGINE / LOCAL MOVEMENT CONCEPTS</text><g transform="translate(25 55)"><rect width="308" height="158" rx="12" fill="#162235"/><text x="16" y="26" font-size="14" font-weight="bold">SEEK</text><text x="16" y="143" font-size="12" fill="#8b9bb4">Approach the target</text><path d="M80 90 L240 80" stroke="#6ae4d4" stroke-width="2" marker-end="url(#arrow)"/><circle cx="80" cy="90" r="8" fill="#6ae4d4"/><circle cx="245" cy="80" r="8" fill="none" stroke="#f3c577" stroke-width="2"/></g><g transform="translate(353 55)"><rect width="308" height="158" rx="12" fill="#162235"/><text x="16" y="26" font-size="14" font-weight="bold">FLEE</text><text x="16" y="143" font-size="12" fill="#8b9bb4">Escape the threat</text><path d="M230 90 L70 80" stroke="#6ae4d4" stroke-width="2" marker-end="url(#arrow)"/><circle cx="230" cy="90" r="8" fill="#6ae4d4"/><circle cx="265" cy="80" r="8" fill="none" stroke="#f3c577" stroke-width="2"/></g><g transform="translate(681 55)"><rect width="308" height="158" rx="12" fill="#162235"/><text x="16" y="26" font-size="14" font-weight="bold">ARRIVE</text><text x="16" y="143" font-size="12" fill="#8b9bb4">Reduce desired speed</text><circle cx="240" cy="80" r="40" fill="none" stroke="#f3c577" stroke-dasharray="4 4"/><path d="M80 90 L220 80" stroke="#6ae4d4" stroke-width="2" marker-end="url(#arrow)"/><circle cx="80" cy="90" r="8" fill="#6ae4d4"/><circle cx="245" cy="80" r="8" fill="none" stroke="#f3c577" stroke-width="2"/></g><g transform="translate(25 230)"><rect width="308" height="158" rx="12" fill="#162235"/><text x="16" y="26" font-size="14" font-weight="bold">PURSUIT</text><text x="16" y="143" font-size="12" fill="#8b9bb4">Predict target motion</text><path d="M65 90 L230 50" stroke="#6ae4d4" stroke-width="2" marker-end="url(#arrow)"/><circle cx="65" cy="90" r="8" fill="#6ae4d4"/><circle cx="245" cy="50" r="8" fill="none" stroke="#f3c577" stroke-width="2"/><path d="M210 100 245 50" stroke="#f3c577" stroke-dasharray="4 4"/></g><g transform="translate(353 230)"><rect width="308" height="158" rx="12" fill="#162235"/><text x="16" y="26" font-size="14" font-weight="bold">WANDER</text><text x="16" y="143" font-size="12" fill="#8b9bb4">Explore a local circle</text><circle cx="210" cy="80" r="32" fill="none" stroke="#8b9bb4" stroke-dasharray="4 4"/><path d="M65 90 L225 50" stroke="#6ae4d4" stroke-width="2" marker-end="url(#arrow)"/><circle cx="65" cy="90" r="8" fill="#6ae4d4"/><circle cx="245" cy="50" r="8" fill="none" stroke="#f3c577" stroke-width="2"/></g><g transform="translate(681 230)"><rect width="308" height="158" rx="12" fill="#162235"/><text x="16" y="26" font-size="14" font-weight="bold">COMPOSITION</text><text x="16" y="143" font-size="12" fill="#8b9bb4">Blend / prioritize</text><path d="M65 90 L230 80" stroke="#6ae4d4" stroke-width="2" marker-end="url(#arrow)"/><circle cx="65" cy="90" r="8" fill="#6ae4d4"/><circle cx="245" cy="80" r="8" fill="none" stroke="#f3c577" stroke-width="2"/><path d="M65 90 180 115 M65 90 180 45" stroke="#a497ff" stroke-width="2"/></g></g></svg>
