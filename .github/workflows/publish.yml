name: Prepare and publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload this existing version tag (branch runs remain preflight only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pub-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.3.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Match tag to package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from tool.release_bump import package_version
          if os.environ['RELEASE_TAG'] != 'v' + package_version(Path('.')):
              raise SystemExit('Tag and pubspec version must match exactly')
          PY
      - name: Reject branch upload requests
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type != 'tag'
        run: |
          echo '::error::Publishing requires an existing version tag, not a branch.'
          exit 1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart run example/polyline_following.dart
      - run: dart pub publish --dry-run
        if: matrix.sdk == 'stable'

  publish:
    name: Publish approved tag
    needs: validate
    if: >-
      vars.PUB_DEV_PUBLISH_ENABLED == 'true' &&
      startsWith(github.ref, 'refs/tags/') &&
      (github.event_name == 'push' || inputs.publish == true)
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
      use-flutter: false
