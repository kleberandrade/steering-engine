name: Automatic version and source release

on:
  workflow_run:
    workflows: ['Dart and Flutter CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version policy; auto uses conventional commits'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: 'Preview only: do not change metadata, tags or publish'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: steering-release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_RELEASE_ENABLED != 'false' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha || github.sha }}
      RELEASE_BUMP: ${{ inputs.bump || 'auto' }}
      RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Require current main and successful source CI
        id: gate
        run: |
          if [ "$(git rev-parse HEAD)" != "$RELEASE_EXPECTED_HEAD" ]; then
            echo 'A newer main commit exists; wait for its CI instead.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$RELEASE_DRY_RUN" != 'true' ]; then
            count=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$RELEASE_EXPECTED_HEAD" --limit 20 --json conclusion,event --jq '[.[] | select(.conclusion == "success" and .event == "push")] | length')
            if [ "$count" = '0' ]; then
              echo '::error::The exact main commit needs a successful push CI run.'
              exit 1
            fi
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Plan semantic version
        if: steps.gate.outputs.ready == 'true'
        id: plan
        run: |
          python3 tool/release_bump.py --bump "$RELEASE_BUMP" --output "$RUNNER_TEMP/release-plan.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-plan.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('changed=' + str(plan['changed']).lower() + '\n')
              for key in ('version', 'tag'):
                  output.write(key + '=' + plan.get(key, '') + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Release plan\n\n')
              summary.write('Preview only: ' + os.environ['RELEASE_DRY_RUN'] + '\n\n')
              summary.write('Next tag: ' + plan.get('tag', 'none; no releasable commits') + '\n')
          PY
      - uses: dart-lang/setup-dart@v1
        if: steps.plan.outputs.changed == 'true' && env.RELEASE_DRY_RUN != 'true'
        with:
          sdk: stable
      - name: Apply and validate release metadata
        if: steps.plan.outputs.changed == 'true' && env.RELEASE_DRY_RUN != 'true'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python3 tool/release_bump.py --bump "$RELEASE_BUMP" --apply --notes "$RUNNER_TEMP/release-notes.md"
          dart pub get
          dart analyze --fatal-infos
          dart test
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml CHANGELOG.md
          git commit -m "chore(release): $RELEASE_VERSION [skip release]"
          dart pub publish --dry-run
      - name: Atomically push metadata and version tag
        if: steps.plan.outputs.changed == 'true' && env.RELEASE_DRY_RUN != 'true'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"
      - name: Create GitHub source release
        if: steps.plan.outputs.changed == 'true' && env.RELEASE_DRY_RUN != 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "steering_engine $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Dispatch publisher on the created tag
        if: >-
          steps.plan.outputs.changed == 'true' &&
          env.RELEASE_DRY_RUN != 'true' &&
          vars.PUB_DEV_PUBLISH_ENABLED == 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" -f publish=true
