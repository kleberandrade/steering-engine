name: Dart and Flutter CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.3.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test example benchmark
        if: matrix.sdk == 'stable'
      - run: dart analyze --fatal-infos
      - uses: actions/setup-python@v5
        if: matrix.sdk == 'stable'
        with:
          python-version: '3.x'
      - run: python3 tool/check_docs.py --extract-dart /tmp/steering-doc-examples
        if: matrix.sdk == 'stable'
      - run: python3 tool/generate_wiki_diagrams.py --check
        if: matrix.sdk == 'stable'
      - name: Compile and run handbook examples
        if: matrix.sdk == 'stable'
        run: |
          for example in /tmp/steering-doc-examples/*.dart; do
            dart --packages=.dart_tool/package_config.json "$example"
          done
      - run: dart test
      - run: dart run example/steering_engine_example.dart
      - run: dart run example/composition.dart
      - run: dart run example/path_following.dart
      - run: dart run example/obstacle_avoidance.dart
      - run: dart run example/flocking.dart
      - run: dart run example/following.dart
      - run: dart compile js example/following.dart -o /tmp/steering-following.js
      - run: node /tmp/steering-following.js
      - run: dart compile js example/spatial_index.dart -o /tmp/steering-spatial.js
      - run: node /tmp/steering-spatial.js
      - run: dart compile js example/flocking.dart -o /tmp/steering-flocking.js
      - run: node /tmp/steering-flocking.js
      - run: dart compile js example/obstacle_avoidance.dart -o /tmp/steering-obstacles.js
      - run: node /tmp/steering-obstacles.js
      - run: dart compile js example/path_following.dart -o /tmp/steering-path.js
      - run: node /tmp/steering-path.js
      - run: dart compile js example/steering_engine_example.dart -o /tmp/steering-example.js
      - run: node /tmp/steering-example.js
      - run: dart pub publish --dry-run
        if: matrix.sdk == 'stable'
  flutter_lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example/flutter_lab
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build web --no-web-resources-cdn --base-href /steering-engine/
      - uses: actions/upload-artifact@v4
        with:
          name: steering-lab-web
          path: example/flutter_lab/build/web

  flame_example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example/flame_lab
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build web --no-web-resources-cdn --base-href /steering-engine/flame/
      - uses: actions/upload-artifact@v4
        with:
          name: steering-flame-web
          path: example/flame_lab/build/web

  pages:
    name: Publish interactive laboratories
    needs: [dart, flutter_lab, flame_example]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: steering-lab-web
          path: public
      - uses: actions/download-artifact@v4
        with:
          name: steering-flame-web
          path: public/flame
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
